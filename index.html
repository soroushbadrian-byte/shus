<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>آب‌وهوای جهان</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="theme-default">
  <canvas id="fx" aria-hidden="true"></canvas>

  <main class="container py-4 py-md-5">
    <header class="text-center mb-4">
      <h1 class="display-5 fw-bold">🌍 آب‌وهوای جهان</h1>
      <p class="lead opacity-75 mb-0">نام کشور یا شهر را بنویسید و وضعیت لحظه‌ای هوا را ببینید</p>
    </header>

    <!-- فرم جستجو -->
    <form id="searchForm" class="row justify-content-center g-2 mb-3" autocomplete="off">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="input-group input-group-lg glass-input">
          <input id="cityInput" type="text" class="form-control" placeholder="مثلاً: ایران، آلمان، Tokyo ..." required>
          <button class="btn btn-light fw-bold px-4" type="submit">جستجو</button>
        </div>
      </div>
    </form>

    <!-- پیشنهادهای سریع -->
    <div id="quick" class="d-flex flex-wrap justify-content-center gap-2 mb-4"></div>

    <!-- پیام‌ها -->
    <div id="status" class="text-center my-4 d-none"></div>

    <!-- نتایج دیگر برای نام‌های مشابه -->
    <div id="alternatives" class="d-flex flex-wrap justify-content-center gap-2 mb-3"></div>

    <!-- کارت اصلی -->
    <section id="result" class="d-none">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-10 col-xl-8">
          <div class="glass-card p-4 p-md-5 text-center">
            <h2 id="place" class="fw-bold mb-1"></h2>
            <div id="localTime" class="opacity-75 small mb-3"></div>

            <div id="icon" class="main-icon" role="img"></div>
            <div id="condition" class="fs-4 mb-2"></div>
            <div id="temp" class="temp-big"></div>
            <div id="feels" class="opacity-75 mb-4"></div>

            <div class="row g-3">
              <div class="col-12 col-sm-4">
                <div class="stat">
                  <div class="stat-icon">💧</div>
                  <div class="stat-label">رطوبت</div>
                  <div id="humidity" class="stat-value"></div>
                </div>
              </div>
              <div class="col-12 col-sm-4">
                <div class="stat">
                  <div class="stat-icon">🌬️</div>
                  <div class="stat-label">سرعت باد</div>
                  <div id="wind" class="stat-value"></div>
                </div>
              </div>
              <div class="col-12 col-sm-4">
                <div class="stat">
                  <div class="stat-icon">🧭</div>
                  <div class="stat-label">جهت باد</div>
                  <div id="windDir" class="stat-value"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <footer class="text-center small opacity-75 mt-5">
      داده‌ها از <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
